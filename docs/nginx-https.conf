# Phase 2 — HTTPS (activé après obtention du certificat)
# DOMAIN est remplacé par deploy.sh via sed

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── CRM Agenda (/agenda) ──────────────────────────────────────────────────
    # Les locations regex doivent être AVANT ~* fichiers statiques :
    # nginx évalue les regex dans l'ordre de déclaration, la première qui
    # matche gagne — sans ça, ~* \.(js|css)$ intercepte les assets de /agenda/.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /agenda {
        return 301 /agenda/;
    }

    # API backend : strip /agenda/api/ → crm_backend:5000/
    location ~ ^/agenda/api/ {
        set $upstream_api http://crm_backend:5000;
        rewrite ^/agenda/api/(.*) /$1 break;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }

    # Frontend SPA : strip /agenda/ → crm_frontend:80/
    location ~ ^/agenda/ {
        set $upstream_front http://crm_frontend;
        rewrite ^/agenda/(.*) /$1 break;
        proxy_pass         $upstream_front;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Fichiers statiques du site w-circle (après /agenda/ pour ne pas intercepter ses assets)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
